name: Validate bot Python

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check scraper syntax
        run: python -m py_compile app.py main.py database.py supabase_sync.py job_availability.py scrapers/*.py
