name: Test bot integrity and CX CS coverage

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m py_compile config.py main.py database.py app.py job_availability.py scrapers/*.py tests/*.py
      - run: python -m unittest discover -s tests -v
